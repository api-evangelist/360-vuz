aid: 360-vuz
name: 360 VUZ
description: >-
  VUZ (360 VUZ) is an immersive social video platform delivering live and on-demand 360-degree and VR
  content across sports, concerts, entertainment, celebrities, travel, and master classes. Viewers get
  exclusive immersive access to top events on mobile, tablet, desktop, and VR headsets including Apple
  Vision Pro. Founded in the MENA region with headquarters in Riyadh (KAFD) and offices in Dubai, Amman,
  and Los Angeles, VUZ is backed by 500 Global among other investors. For content partners and creators,
  VUZ exposes a Creator API (documented via a public Postman collection at creatorapi.360vuz.com) used to
  publish and manage immersive video. This profile was surfaced as a 500 Global portfolio company and
  enriched by the API Evangelist pipeline.
